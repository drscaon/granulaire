name: CI

# Two levels. On a commit (push to main, pull request): the fast tests (pytest -m "not
# slow") on Ubuntu and Python 3.12, and the engine checks on a sample of the presets
# (.github/ci_presets.py). Before a release (release.yml calls this workflow with
# full: true) and with the "Run workflow" button: every test on Linux, Windows and macOS
# and on every Python, the oldest OpenUSD, and the engine checks on every preset.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Every test, platform and preset (as before a release)
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Every test, platform and preset
        type: boolean
        default: true

permissions:
  contents: read

env:
  FULL: ${{ inputs.full && 'true' || 'false' }}  # read by .github/ci_presets.py and the steps

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # lint and format, tests on every Python and platform, oldest OpenUSD, package build:
    # the same in the four generators, written once in the primvaria repository
    uses: drscaon/primvaria/.github/workflows/generator-checks.yml@main
    with:
      full: ${{ inputs.full || false }}
      package: granulaire
      smoke: |
        granulaire --version
        granulaire list
        granulaire generate --preset crushed_gravel --shapes 5 --copies 2 --moisture --out ci-output
        python -m granulaire.validate ci-output

  sim:
    name: MuJoCo pile test of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Pile test of the presets
        run: |
          for preset in $(python .github/ci_presets.py granulaire.presets); do
            granulaire generate --preset "$preset" --shapes 20 --copies 2 --moisture --no-deformable --out ci-sim > /dev/null
          done
          granulaire sim-test ci-sim/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-reports
          path: |
            ci-sim/*/sim_test/sim_test.json
            ci-sim/*/sim_test/mujoco_pile.xml
          retention-days: 14

  blender:
    name: Blender pile test of the presets (bpy, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for the bpy module
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[dev,blender]"
      - name: Blender test
        run: pytest tests/test_physics.py -v -k blender
      - name: Pile test of the presets
        run: |
          for preset in $(python .github/ci_presets.py granulaire.presets); do
            granulaire generate --preset "$preset" --shapes 20 --copies 2 --moisture --no-deformable --out ci-blender > /dev/null
          done
          granulaire blender-test ci-blender/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blender-test-reports
          path: ci-blender/*/blender_test/blender_test.json
          retention-days: 14

  openusd:
    name: OpenUSD validators of the presets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate the presets
        run: |
          # cherry_tomatoes: a deformable preset in every sample, for the OmniPhysics step
          for preset in $(python .github/ci_presets.py granulaire.presets cherry_tomatoes); do
            granulaire generate --preset "$preset" --shapes 3 --copies 1 --moisture --out ci-usd > /dev/null
          done
      - name: Validate every file (what usdchecker runs)
        run: python -m granulaire.validate ci-usd
      - name: Check every file against the Primvaria contract
        run: python -m granulaire.conformance ci-usd
      - name: OmniPhysics layers of the deformable presets (structure; not simulated)
        run: python -m granulaire.omniphysics ci-usd
