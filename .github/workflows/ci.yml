name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # one run on each other platform, on a recent Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        run: |
          granulaire --version
          granulaire list
          granulaire generate --preset crushed_gravel --shapes 5 --copies 2 --moisture --out ci-output
          python -m granulaire.validate ci-output


  sim:
    name: MuJoCo pile test of every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Pile test of every preset (deformable presets as rigid bodies)
        run: |
          for preset in $(python -c "from granulaire.presets import PRESETS; print(' '.join(PRESETS))"); do
            granulaire generate --preset "$preset" --shapes 20 --copies 2 --moisture --no-deformable --out ci-sim > /dev/null
          done
          granulaire sim-test ci-sim/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-reports
          path: |
            ci-sim/*/sim_test/sim_test.json
            ci-sim/*/sim_test/mujoco_pile.xml
          retention-days: 14

  blender:
    name: Blender pile test of every preset (bpy, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for the bpy module
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e ".[dev,blender]"
      - name: Blender test
        run: pytest tests/test_physics.py -v -k blender
      - name: Pile test of every preset (deformable presets as rigid bodies)
        run: |
          for preset in $(python -c "from granulaire.presets import PRESETS; print(' '.join(PRESETS))"); do
            granulaire generate --preset "$preset" --shapes 20 --copies 2 --moisture --no-deformable --out ci-blender > /dev/null
          done
          granulaire blender-test ci-blender/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blender-test-reports
          path: ci-blender/*/blender_test/blender_test.json
          retention-days: 14

  openusd:
    name: OpenUSD validators of every preset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Generate every preset
        run: |
          for preset in $(python -c "from granulaire.presets import PRESETS; print(' '.join(PRESETS))"); do
            granulaire generate --preset "$preset" --shapes 3 --copies 1 --moisture --out ci-usd > /dev/null
          done
      - name: Validate every file (what usdchecker runs)
        run: python -m granulaire.validate ci-usd

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/granulaire --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
