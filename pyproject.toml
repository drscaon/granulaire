[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granulaire"
version = "0.1.0"
description = "Realistic granular materials for physical AI: procedural grains with measured shape, mass and moisture, exported to OpenUSD for robot simulation and synthetic perception data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniel Régis Sarmento Caon" }]
keywords = ["granular", "simulation", "openusd", "procedural", "robotics", "physical-ai", "synthetic-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "trimesh>=4.0",
    "usd-core>=24.0",
]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
granulaire = "granulaire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # scikit-image's marching cubes on NumPy >= 2.5 (third-party, harmless)
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
