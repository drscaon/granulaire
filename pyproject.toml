[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granulaire"
version = "0.2.0b3"
description = "Realistic granular assets generator for Physical AI: procedural grains with measured shape, mass and moisture, exported to OpenUSD for robot simulation and synthetic perception data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Daniel Régis Sarmento Caon" }]
keywords = ["granular", "simulation", "openusd", "procedural", "robotics", "physical-ai", "synthetic-data", "robot-learning", "primvaria"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "trimesh>=4.0",
    "usd-core>=24.0",
]

[project.optional-dependencies]
render = ["matplotlib>=3.7"]
# MuJoCo pile test (granulaire sim-test)
sim = ["mujoco>=3.2"]
# Blender as a Python module for the Blender pile test: the bpy wheels exist for one Python version only
blender = ["bpy>=5.1; python_version == '3.13'"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.7", "mujoco>=3.2"]

[project.urls]
Homepage = "https://github.com/drscaon/granulaire"
Issues = "https://github.com/drscaon/granulaire/issues"
Changelog = "https://github.com/drscaon/granulaire/blob/main/CHANGELOG.md"
Suite = "https://github.com/drscaon/primvaria"

[project.scripts]
granulaire = "granulaire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # scikit-image's marching cubes on NumPy >= 2.5 (third-party, harmless)
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:skimage",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
